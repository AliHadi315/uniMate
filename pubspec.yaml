name: unimate
description: "UniMate — a student companion app for courses, tasks, resources and AI study help."
publish_to: 'none'
version: 0.3.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # storage
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.0.14

  # state
  provider: ^6.1.2

  # network / config
  http: ^1.2.0
  flutter_dotenv: ^6.0.0

  # utils
  intl: ^0.20.2
  crypto: ^3.0.3

  # files & links
  file_picker: ^8.3.7
  open_file: ^3.2.1
  url_launcher: ^6.3.0

  # reminders
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
